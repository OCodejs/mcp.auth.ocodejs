name: Auth CI

on:
  pull_request:
    branches: [main, "feat/**", "fix/**"]
  push:
    branches: [main, "feat/**", "fix/**"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Keep validation isolated per PR/ref. Do not grant write permissions to CI jobs.
concurrency:
  group: auth-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  queue: max

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/identity_auth_ci
      AUTH_SECRET: ci-only-not-a-production-secret-please-replace
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      AUTH_PREVIEW_DB_PUSH: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # The lockfile is known to be stale. Regenerate it in the isolated runner,
      # upload it for review, then prove npm ci can install from that generated file.
      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload generated lockfile for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generated-package-lock-${{ github.run_id }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Install dependencies from generated lockfile
        run: npm ci --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Type check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Publish validation summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Auth CI"
            echo "- Result: **${JOB_STATUS}**"
            echo "- Trigger: ${GITHUB_EVENT_NAME}"
            echo "- Ref: ${GITHUB_REF}"
            echo "- Node: $(node --version 2>/dev/null || echo unavailable)"
            echo "- npm: $(npm --version 2>/dev/null || echo unavailable)"
            echo "- Database push: disabled"
            echo "- Repository writes: disabled"
            echo "- Deployment: not configured"
          } >> "$GITHUB_STEP_SUMMARY"
